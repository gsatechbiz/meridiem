<style>
@font-face {
  font-family: 'Arimo';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(fonts/arimo-latin.woff2) format('woff2');
}
@font-face {
  font-family: 'Carlito';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/carlito-400-latin.woff2) format('woff2');
}

:root {
  --navy: #12307D;
  --blue: #124BCC;
  --magenta: #D9456C;
  --terracotta: #D19977;
  --peach: #FFDEA6;
  --display: Arial, Arimo, "Liberation Sans", Helvetica, sans-serif;
  --body: Calibri, Carlito, "Segoe UI", sans-serif;
  --gutter: clamp(20px, 6vw, 100px);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--navy);
  color: #fff;
  font-family: var(--body);
  font-size: clamp(1.0625rem, 1rem + .25vw, 1.25rem);
  line-height: 1.5;
  text-wrap: pretty;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--magenta); color: #fff; }

a { color: inherit; }

:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 24px var(--gutter);
  color: #fff;
  text-decoration: none;
}
.brand svg { width: 36px; height: 36px; display: block; }
.brand span { font-family: var(--display); font-weight: 700; font-size: 1.1875rem; letter-spacing: -0.01em; }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(40px, 8vw, 96px) var(--gutter) clamp(56px, 9vw, 120px);
  position: relative;
  z-index: 1;
}

h1 {
  margin: 0;
  max-width: 16ch;
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: .94;
  font-size: clamp(2.25rem, .6rem + 4.4vw, 4.5rem);
  text-wrap: balance;
}
h1 em { font-style: normal; color: var(--peach); }

.rule { width: 88px; height: 8px; background: var(--magenta); margin: clamp(28px, 4vw, 40px) 0; }

p { margin: 0; max-width: 46ch; color: var(--peach); }

.route { margin: clamp(36px, 5vw, 56px) 0 0; width: min(100%, 680px); height: auto; overflow: visible; }
.route path { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.route .plan { stroke: var(--peach); stroke-dasharray: 6 7; opacity: .5; }
.route .new { stroke: var(--peach); }
.route circle { fill: var(--navy); stroke: var(--peach); stroke-width: 2; vector-effect: non-scaling-stroke; }
.route circle.key { fill: var(--magenta); stroke: var(--magenta); }
.route text { fill: var(--peach); font-family: var(--body); font-style: italic; font-size: 14px; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; margin-top: clamp(36px, 5vw, 56px); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  min-height: 56px;
  padding: 16px 26px;
  background: var(--magenta);
  color: #fff;
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.1875rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  text-decoration: none;
  transform: translateY(0);
  transition: background-color .25s var(--ease-out);
}
.btn:hover { background: var(--blue); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 22px; height: 22px; transition: transform .35s var(--ease-out); }
.btn:hover svg { transform: translateX(5px); }

.link {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
  text-decoration-color: var(--peach);
  transition: text-underline-offset .25s var(--ease-out);
}
.link:hover { text-underline-offset: 9px; }
.link:active { text-underline-offset: 6px; }

.sun { position: absolute; right: 0; bottom: 0; width: clamp(200px, 30vw, 420px); height: auto; z-index: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>

<main>

  <span class="rule" aria-hidden="true"></span>
  <p>O endereço não existe ou mudou de lugar. Quando um sinal muda a leitura, a rota se revisa — inclusive aqui.</p>

  <svg class="route" viewBox="0 0 680 140" aria-hidden="true">

    <path class="new" d="M8 46 C180 46 220 110 400 110 L664 110"/>
    <circle cx="8" cy="46" r="6"/>

    <text x="240" y="28" text-anchor="middle">aqui</text>

</main>

</svg>
