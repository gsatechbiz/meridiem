<style>
@font-face { font-family: "Arimo"; font-style: normal; font-weight: 400 700; font-display: swap; src: url("/fonts/arimo-latin.woff2") format("woff2"); }
@font-face { font-family: "Carlito"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/carlito-400-latin.woff2") format("woff2"); }
@font-face { font-family: "Carlito"; font-style: normal; font-weight: 700; font-display: swap; src: url("/fonts/carlito-700-latin.woff2") format("woff2"); }

:root {
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;
  --text-sm: 1rem; --text-md: 1.125rem; --text-lg: 1.25rem; --text-lead: clamp(1.125rem, 0.35vw + 1rem, 1.375rem); --text-display: clamp(2.75rem, 5vw + 1rem, 5.25rem);
  --brand-navy: #12307D; --brand-magenta: #D9456C; --brand-terracotta: #D19977; --brand-peach: #FFDEA6;
  --color-band: var(--brand-navy); --color-band-ink: #FFF3DE; --color-band-sun: var(--brand-peach);
  --color-accent: #C63A60; --color-accent-ink: #FFF9EE;
  --font-display: Arial, "Arimo", "Liberation Sans", Helvetica, sans-serif; --font-body: Calibri, "Carlito", "Segoe UI", sans-serif;
  --container: 1440px; --gutter: 64px; --radius-pill: 999px; --rule-bar: 2px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-micro: 120ms; --dur-short: 220ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { position: relative; display: flex; flex-direction: column; min-height: 100dvh; margin: 0; overflow-y: clip; background: var(--color-band); color: var(--color-band-ink); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.55; -webkit-font-smoothing: antialiased; }
::selection { background: var(--color-accent); color: var(--color-accent-ink); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--color-band-sun); outline-offset: 2px; }
.container { position: relative; z-index: 1; width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

.brand { display: inline-flex; align-items: center; gap: var(--space-sm); min-height: 72px; font: 700 var(--text-lg)/1 var(--font-display); letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; }
.brand svg { flex: none; display: block; width: 36px; height: 36px; }

main { flex: 1; display: flex; align-items: center; padding-block: var(--space-xl) var(--space-3xl); }
h1 { margin: 0; max-width: 16ch; font: 700 var(--text-display)/1.05 var(--font-display); letter-spacing: -0.02em; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { max-width: 46ch; margin: var(--space-lg) 0 0; font-size: var(--text-lead); line-height: 1.45; text-wrap: pretty; }

.route { display: block; width: min(100%, 680px); height: auto; margin-top: var(--space-xl); overflow: visible; }
.route path { fill: none; stroke: var(--brand-terracotta); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.route .plan { stroke-dasharray: 6 7; }
.route .new { stroke: var(--color-band-sun); }
.route circle { fill: var(--color-band); stroke: var(--color-band-sun); stroke-width: 2; vector-effect: non-scaling-stroke; }
.route circle.key { fill: var(--brand-magenta); stroke: var(--brand-magenta); }
.route text { fill: var(--color-band-ink); font-family: var(--font-body); font-weight: 700; font-size: 16px; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-xl); margin-top: var(--space-xl); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 var(--space-xl); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-accent-ink); font: 700 var(--text-lg)/1 var(--font-display); text-decoration: none; white-space: nowrap; transition: background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-band-sun); color: var(--brand-navy); }
.btn:active { transform: translateY(1px); }
.link { display: inline-flex; align-items: center; min-height: 44px; font: 700 var(--text-lg)/1 var(--font-body); text-decoration: underline; text-decoration-thickness: var(--rule-bar); text-underline-offset: 0.3em; transition: color var(--dur-short) var(--ease-out); }
.link:hover { color: var(--color-band-sun); }
.link:active { transform: translateY(1px); }

.sun { position: absolute; right: -160px; bottom: -200px; width: 420px; height: 420px; border-radius: 50%; background: var(--brand-peach); box-shadow: 0 0 0 46px var(--brand-terracotta), 0 0 0 92px var(--brand-magenta); pointer-events: none; }

@media (max-width: 60rem) { :root { --gutter: 24px; } }
@media (max-width: 40rem) {
  :root { --gutter: 16px; }
  .sun { width: 220px; height: 220px; right: -120px; bottom: -130px; box-shadow: 0 0 0 26px var(--brand-terracotta), 0 0 0 52px var(--brand-magenta); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
